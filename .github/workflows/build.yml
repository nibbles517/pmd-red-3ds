# Builds the shareable .3dsx: no ROM here, and none of its data in the result.
#
# pret's pmd-red is built with a stand-in ROM of zeros (its data is never
# used), the game's objects are compiled, and tools/rom_scrub.py zeroes every
# stretch of them that is the ROM's data, as port/romdata.list.xz lists. The
# .3dsx copies those back from the player's own pmdred.gba when it starts.
#
# The list only fits objects built exactly as they were when it was made, so
# the compiler is pinned (xPack arm-none-eabi-gcc 14.2.1-1.1, as used locally)
# and pret's commit comes from upstream.lock.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # (the release, for tags)

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      XPACK: xpack-arm-none-eabi-gcc-14.2.1-1.1
    steps:
      - name: Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential git python3 libpng-dev xz-utils curl ca-certificates
          curl -fsSL -o /tmp/xpack.tar.gz \
            https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/$XPACK-linux-x64.tar.gz
          mkdir -p /opt/xpack && tar -xzf /tmp/xpack.tar.gz -C /opt/xpack
          echo "/opt/xpack/$XPACK/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pret/pmd-red (with a stand-in ROM)
        run: |
          git config --global --add safe.directory '*'
          sh tools/bootstrap.sh
          head -c 33554432 /dev/zero > build/upstream/baserom.gba
          # Only pret's tools and data objects are needed; its own link of
          # the port's patched C is expected to fail (-k carries on).
          make -C build/upstream modern -k -j"$(nproc)" > build/upstream.log 2>&1 || true
          ls build/upstream/build/pmd_red_modern/data/*.o | wc -l

      - name: Game (without the ROM's data)
        run: make prelink-shared -j"$(nproc)"

      - name: 3DS
        run: make 3ds GAME_PRELINK=build/pmd-red-game-shared.o

      - uses: actions/upload-artifact@v4
        with:
          name: pmd-red-3ds
          path: build/pmd-red-3ds.3dsx

      - name: Release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/pmd-red-3ds.3dsx
          draft: true
